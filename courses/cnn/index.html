<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function () {
    /* 深色模式：渲染前应用，避免闪烁 */
    try { var _t = localStorage.getItem('dl_theme'); if (_t === 'dark') document.documentElement.classList.add('dl-dark'); else if (_t === 'sepia') document.documentElement.classList.add('dl-sepia'); } catch (e) {}
    /* 课程口令门（简单保护） */
    try { if (localStorage.getItem('dl_gate_v1') === '1') return; } catch (e) {}
    document.documentElement.classList.add('dl-gating');
    document.addEventListener('DOMContentLoaded', function () {
        var g = document.createElement('div');
        g.id = 'dl-gate';
        g.innerHTML = '<div class="dl-gate-card">'
            + '<div style="font-size:34px;">🔒</div>'
            + '<h2 style="margin:10px 0 6px;font-size:20px;color:#1E293B;">深度学习课程站</h2>'
            + '<p style="margin:0 0 16px;font-size:14px;color:#64748B;">请输入课程口令（课程群内公布）</p>'
            + '<input id="dl-gate-input" type="password" placeholder="请输入口令" style="width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;border:1px solid #CBD5E1;border-radius:8px;">'
            + '<button id="dl-gate-btn" style="margin-top:12px;width:100%;padding:10px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;">进入课程</button>'
            + '<p id="dl-gate-err" style="display:none;margin:10px 0 0;font-size:13px;color:#DC2626;">口令不正确，请重试</p>'
            + '</div>';
        document.body.appendChild(g);
        var input = g.querySelector('#dl-gate-input');
        input.focus();
        function unlock(ok) {
            if (!ok) { g.querySelector('#dl-gate-err').style.display = 'block'; input.select(); return; }
            try { localStorage.setItem('dl_gate_v1', '1'); } catch (e) {}
            document.documentElement.classList.remove('dl-gating');
            g.remove();
        }
        function tryUnlock() {
            if (!window.crypto || !crypto.subtle) {
                var err = g.querySelector('#dl-gate-err');
                err.textContent = '当前浏览器不支持安全校验，请换用 Chrome / Edge 访问';
                err.style.display = 'block';
                return;
            }
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(input.value)).then(function (buf) {
                var hex = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
                unlock(hex === '73634a650a686aed3b525c5cf4c80cbd01f2ea795763bd37541f17eb707c144b');
            }).catch(function () {
                var err2 = g.querySelector('#dl-gate-err');
                err2.textContent = '校验出错，请刷新页面重试';
                err2.style.display = 'block';
            });
        }
        g.querySelector('#dl-gate-btn').addEventListener('click', tryUnlock);
        input.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryUnlock(); });
    });
})();
</script>
